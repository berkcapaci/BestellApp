<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Capaci</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/font.css">
    <link rel="stylesheet" href="style/basic.css">
</head>
<body>
    <header>
        <img src="assets/img/pizzakoch.png" alt="Logo">
        <img src="assets/icons/menubar.png" alt="Menu icon, no function">
    </header>
    <main>
        <section id="pizza-content"></section>
        <aside id="basket-content"></aside>
    </main>
    <footer>
        <div>
            <img src="assets/icons/copyright.png" alt="Copyright">
            <p>2026 Pizzeria Capaci</p>
        </div>
        <div>Imprint</div>
        <div>Cookie Preferences</div>
    </footer>

    <div id="order-dialog" class="d-none" onclick="closeOrderDialog()">
        <div class="dialog-content" onclick="event.stopPropagation()">
            <img src="assets/img/order_confirmed.jpg" alt="Order Confirmed">
            <h2>Order confirmed!</h2>
            <p>Your food is on the way!</p>
            <button onclick="closeOrderDialog()">Close</button>
        </div>
    </div>

    <script src="script/data.js"></script>
    <script src="script/templates.js"></script>
    <script src="script.js"></script>
</body>
</html>
